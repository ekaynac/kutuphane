# Standalone install (#76, #242): Postgres, Kütüphane Core, the ingress proxy and a local CPU model server. No LLMDAP:
# only open source images and the images of this repository. The full stack (LLMDAP, curator web) is
# deploy/compose.full.yaml.
#   db     (internal): postgres, core
#   web    (internal): ingress, core
#   models (internal): core, embedder
#   edge             : the ingress proxy, the only way in
#   fetch            : models-fetch only, the one service that reaches the Hugging Face Hub
# Core has no network out. It calls the embedder (bge-m3 embeddings, bge-reranker-v2-m3 rerank) directly, through the
# provider `openai` (D88, docs/guide/operations.md "Direct model providers"); the call stays on the internal network
# `models` and has a `model_call` row. The embedder has no network out either: the weights come from the volume
# `models`, which the one-shot `models-fetch` fills once (about 5 GB; a second `up` finds them and downloads nothing).
# Answers (`ask_library`, `POST /v1/ask`) need an answer model that you name (docs/guide/operations.md): not set here,
# so they give 503. No model server at all (full text search only): docs/guide/operations.md, "Standalone embedder".
#
# Dev and tests: `docker compose -f compose.yaml -f compose.build.yaml up -d --wait postgres` (port 55432 on localhost).
# Standalone install (docs/guide/install.md, "Light install"): `KUTUPHANE_VERSION=<release tag> docker compose up -d --wait`;
# from this checkout: `docker compose -f compose.yaml -f compose.build.yaml up -d --build --wait`.
# Restart (#141): postgres, core, ingress and embedder have `restart: unless-stopped`, so they come back after a crash or a
# host reboot (the Docker daemon must start at boot). `docker compose stop` keeps them stopped.
name: kutuphane

services:
  postgres:   # the same service as deploy/compose.full.yaml, so either file keeps the running container
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kutuphane
      POSTGRES_USER: kutuphane
      POSTGRES_PASSWORD: ${KUTUPHANE_DB_PASSWORD:?set KUTUPHANE_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"   # dev, tests and the CLI on the host; drop in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db, dev, curator-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutuphane -d kutuphane"]
      interval: 2s
      retries: 30

  core:
    image: ghcr.io/ekaynac/kutuphane:${KUTUPHANE_VERSION:?set KUTUPHANE_VERSION to a release tag}
    restart: unless-stopped
    environment:
      # The app role (deploy/db-roles.sql). No KUTUPHANE_LLMDAP_*: no model goes through LLMDAP here.
      # The server refuses to start without the public URL and the issuer; the dev database needs neither.
      KUTUPHANE_DSN: postgresql://kutuphane_app:${KUTUPHANE_APP_DB_PASSWORD:-}@postgres:5432/kutuphane
      KUTUPHANE_PUBLIC_URL: ${KUTUPHANE_PUBLIC_URL:-}
      KUTUPHANE_OIDC_ISSUER: ${KUTUPHANE_OIDC_ISSUER:-}
      KUTUPHANE_OIDC_AUDIENCE: ${KUTUPHANE_OIDC_AUDIENCE:-kutuphane}
      KUTUPHANE_OIDC_JWKS: /run/kutuphane/jwks.json
      KUTUPHANE_REPO_ROOTS: /srv/repos
      # Embeddings and rerank: the embedder below, through the direct provider. The URL, the key and the class are one
      # fixed set (C3): the class `local` belongs to this URL only, so no setting of yours changes one of them. For another
      # endpoint use compose.nomodels.yaml, which gives no class. The key is a placeholder that the embedder ignores:
      # it is not a secret. They are compose values, not code defaults (G13).
      KUTUPHANE_EMBED_PROVIDER: ${KUTUPHANE_EMBED_PROVIDER:-openai}
      KUTUPHANE_EMBED_OPENAI_URL: http://embedder:8000
      KUTUPHANE_EMBED_OPENAI_KEY: not-a-secret
      KUTUPHANE_EMBED_OPENAI_CLASS: local
      KUTUPHANE_EMBED_MODEL: ${KUTUPHANE_EMBED_MODEL:-BAAI/bge-m3}
      KUTUPHANE_RERANK_PROVIDER: ${KUTUPHANE_RERANK_PROVIDER:-openai}
      KUTUPHANE_RERANK_OPENAI_URL: http://embedder:8000
      KUTUPHANE_RERANK_OPENAI_KEY: not-a-secret
      KUTUPHANE_RERANK_OPENAI_CLASS: local
      KUTUPHANE_RERANK_MODEL: ${KUTUPHANE_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      # The answer model is external and not set: an OpenAI-compatible server that you name (operations.md).
      KUTUPHANE_ANSWER_PROVIDER: ${KUTUPHANE_ANSWER_PROVIDER:-}
      KUTUPHANE_ANSWER_OPENAI_URL: ${KUTUPHANE_ANSWER_OPENAI_URL:-}
      KUTUPHANE_ANSWER_OPENAI_KEY: ${KUTUPHANE_ANSWER_OPENAI_KEY:-}
      KUTUPHANE_ANSWER_OPENAI_CLASS: ${KUTUPHANE_ANSWER_OPENAI_CLASS:-}
      KUTUPHANE_ANSWER_MODEL: ${KUTUPHANE_ANSWER_MODEL:-}
    volumes:
      - ${KUTUPHANE_OIDC_JWKS_FILE:-./deploy/jwks.json}:/run/kutuphane/jwks.json:ro
      # Bare mirrors for code citations (docs/24 §10.2), kept current by the operator: core only reads them.
      - ${KUTUPHANE_REPO_DIR:-./deploy/repos}:/srv/repos:ro
    networks: [db, web, models]
    depends_on:
      postgres: {condition: service_healthy}
      embedder: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 10s
      start_period: 30s
      retries: 3

  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KUTUPHANE_BIND:-127.0.0.1}:8080:8080"
    networks: [edge, web]
    depends_on:
      core: {condition: service_healthy}
    healthcheck:   # through the proxy to Core
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      retries: 3

  # Local CPU models (D61): the server of deploy/models, the same image and code as the full stack's embedder. The
  # weights are in the volume `models`, read-only here. No network out.
  embedder:
    image: ghcr.io/ekaynac/kutuphane-models:${KUTUPHANE_VERSION:?set KUTUPHANE_VERSION to a release tag}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      MODELS_THREADS: ${KUTUPHANE_EMBEDDER_THREADS:-4}   # compose setting; the CPU cores that one forward pass uses
      OMP_NUM_THREADS: ${KUTUPHANE_EMBEDDER_THREADS:-4}
    mem_limit: ${KUTUPHANE_EMBEDDER_MEMORY:-6g}
    volumes:
      - models:/hf:ro
    networks: [models]
    depends_on:
      models-fetch: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      start_period: 180s
      retries: 3

  # One-shot: puts the pinned revisions of both models into the volume `models` (nothing to do when they are there;
  # then it needs no network). The only service with a way out to the Hub.
  models-fetch:
    image: ghcr.io/ekaynac/kutuphane-models:${KUTUPHANE_VERSION:?set KUTUPHANE_VERSION to a release tag}
    command: ["python", "-I", "/srv/server.py", "fetch"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/hf
    networks: [fetch]

  publisher:   # owner-credential loop; profile `publisher`, off by default (docs/guide/operations.md)
    profiles: [publisher]
    image: ghcr.io/ekaynac/kutuphane:${KUTUPHANE_VERSION:?set KUTUPHANE_VERSION to a release tag}
    restart: unless-stopped
    # One `kutuphane imports publish-admitted` every KUTUPHANE_PUBLISH_INTERVAL seconds (a compose setting; the
    # container gets it as PUBLISH_INTERVAL, which is not a Core setting), never two at once. Only the
    # exit codes 0 (done) and 3 (done, an index is incomplete) count as a run; any other code ends the container
    # with that code, so `restart` starts it again. The heartbeat file is the health check's proof of a run.
    command:
      - sh
      - -c
      - |
        i="$$PUBLISH_INTERVAL"
        case "$$i" in ""|[!1-9]*|*[!0-9]*) echo "publisher: KUTUPHANE_PUBLISH_INTERVAL must be a positive whole number of seconds without a leading zero" >&2; exit 2;; esac
        [ -n "$$KUTUPHANE_CURATOR_DSN" ] || { echo "publisher: KUTUPHANE_CURATOR_DSN is not set: put it in the file named by KUTUPHANE_PUBLISHER_ENV_FILE" >&2; exit 2; }
        while :; do
          t=$$(date +%s)
          kutuphane imports publish-admitted; rc=$$?
          echo "publisher: run exit=$$rc seconds=$$(( $$(date +%s) - t ))"
          case "$$rc" in 0|3) touch /tmp/publisher-ok;; *) exit "$$rc";; esac
          d=$$(( i - ( $$(date +%s) - t ) ))
          [ "$$d" -gt 0 ] && sleep "$$d"
        done
    env_file:
      # The owner credential (KUTUPHANE_CURATOR_DSN, KUTUPHANE_WEBAUTHN_*): a file outside git and outside the image.
      # Compose reads every service of the file, also one whose profile is off, so `:?` here would stop every
      # command. The default is empty; the loop below stops with the same message when the credential is missing.
      - ${KUTUPHANE_PUBLISHER_ENV_FILE:-/dev/null}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      PUBLISH_INTERVAL: ${KUTUPHANE_PUBLISH_INTERVAL:-60}   # read by the loop and the health check; not a Core setting
    networks: [db]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:   # unhealthy when the last successful run is older than 3 intervals
      test: ["CMD", "python", "-c", "import os, re, sys, time; i = os.environ['PUBLISH_INTERVAL']; sys.exit(0 if re.fullmatch('[1-9][0-9]*', i) and time.time() - os.stat('/tmp/publisher-ok').st_mtime <= 3 * int(i) else 1)"]
      interval: 15s
      start_period: 120s
      retries: 1

volumes:
  pgdata:
  models:   # the model weights (about 5 GB), filled once by models-fetch

networks:
  db: {internal: true}
  web: {internal: true}
  models: {internal: true}   # core and embedder only
  curator-db: {internal: true}   # postgres only here; curator web joins it in the full stack
  fetch: {}   # models-fetch: out to the Hugging Face Hub
  edge: {}
  dev: {}
