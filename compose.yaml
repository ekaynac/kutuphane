# M1a: Postgres only. LLMDAP, IdP and the core/models network split arrive in M1c (docs/07 §3).
name: kutuphane

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: kutuphane
      POSTGRES_USER: kutuphane
      POSTGRES_PASSWORD: ${KUTUPHANE_DB_PASSWORD:?set KUTUPHANE_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutuphane -d kutuphane"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
