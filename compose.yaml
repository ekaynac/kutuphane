# Light install (#76): Postgres, Kütüphane Core and the ingress proxy. No LLMDAP and no model server: only open
# source images and the Core image of this repository. The full stack (LLMDAP, models, curator web) is
# deploy/compose.full.yaml.
#   db  (internal): postgres, core
#   web (internal): ingress, core
#   edge          : the ingress proxy, the only way in
# Core has no network to any model. Search is full text only; answers (`ask_library`, `POST /v1/ask`) give 503.
# The local embedder of the full stack is not part of this file: Core calls a model only through LLMDAP (D3), which
# grants the call and keeps the signed audit chain (AT-09). A direct call would bypass both.
#
# Dev and tests: `docker compose up -d --wait postgres` (port 55432 on localhost).
# Light install (docs/guide/install.md, "Light install"): `docker compose up -d --build --wait`.
# Restart (#141): postgres, core and ingress have `restart: unless-stopped`, so they come back after a crash or a
# host reboot (the Docker daemon must start at boot). `docker compose stop` keeps them stopped.
name: kutuphane

services:
  postgres:   # the same service as deploy/compose.full.yaml, so either file keeps the running container
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kutuphane
      POSTGRES_USER: kutuphane
      POSTGRES_PASSWORD: ${KUTUPHANE_DB_PASSWORD:?set KUTUPHANE_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"   # dev, tests and the CLI on the host; drop in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db, dev, curator-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutuphane -d kutuphane"]
      interval: 2s
      retries: 30

  core:
    build: .
    restart: unless-stopped
    environment:
      # The app role (deploy/db-roles.sql). No KUTUPHANE_LLMDAP_* and no KUTUPHANE_ANSWER_MODEL: no model calls.
      # The server refuses to start without the public URL and the issuer; the dev database needs neither.
      KUTUPHANE_DSN: postgresql://kutuphane_app:${KUTUPHANE_APP_DB_PASSWORD:-}@postgres:5432/kutuphane
      KUTUPHANE_PUBLIC_URL: ${KUTUPHANE_PUBLIC_URL:-}
      KUTUPHANE_OIDC_ISSUER: ${KUTUPHANE_OIDC_ISSUER:-}
      KUTUPHANE_OIDC_AUDIENCE: ${KUTUPHANE_OIDC_AUDIENCE:-kutuphane}
      KUTUPHANE_OIDC_JWKS: /run/kutuphane/jwks.json
      KUTUPHANE_REPO_ROOTS: /srv/repos
    volumes:
      - ${KUTUPHANE_OIDC_JWKS_FILE:-./deploy/jwks.json}:/run/kutuphane/jwks.json:ro
      # Bare mirrors for code citations (docs/24 §10.2), kept current by the operator: core only reads them.
      - ${KUTUPHANE_REPO_DIR:-./deploy/repos}:/srv/repos:ro
    networks: [db, web]
    depends_on:
      postgres: {condition: service_healthy}

  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KUTUPHANE_BIND:-127.0.0.1}:8080:8080"
    networks: [edge, web]
    depends_on: [core]

volumes:
  pgdata:

networks:
  db: {internal: true}
  web: {internal: true}
  curator-db: {internal: true}   # postgres only here; curator web joins it in the full stack
  edge: {}
  dev: {}
