# Single box (D15). Network layout (docs/07 §3, AT-10): one internal network per conversation, so every service
# reaches only the peers it talks to.
#   db      (internal): postgres, core
#   web     (internal): ingress, core
#   gateway (internal): core, llmdap
#   models  (internal): llmdap and the model servers
#   edge              : the ingress proxy, the only bridge between users and core
# Core therefore has no path to anything but Postgres and LLMDAP. Only LLMDAP reaches the model servers.
#
# Dev: `docker compose up -d --wait postgres` (port 55432 on localhost for tests).
# App: `docker compose --profile app up -d --build` (needs the KUTUPHANE_* variables in .env and
#      deploy/llmdap/bridge.env + config/keys.json; see deploy/llmdap/README.md).
# Dev models: add `--profile dev-models` for the deterministic stand-in model server (never for measurements).
# Real local models (D61): the overlay deploy/compose.local-models.yaml (its header has the start command).
name: kutuphane

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: kutuphane
      POSTGRES_USER: kutuphane
      POSTGRES_PASSWORD: ${KUTUPHANE_DB_PASSWORD:?set KUTUPHANE_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"   # dev and tests only; drop in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db, dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutuphane -d kutuphane"]
      interval: 2s
      retries: 30

  core:
    profiles: [app]
    build: .
    environment:
      KUTUPHANE_DSN: postgresql://kutuphane:${KUTUPHANE_DB_PASSWORD}@postgres:5432/kutuphane
      KUTUPHANE_PUBLIC_URL: ${KUTUPHANE_PUBLIC_URL:-}
      KUTUPHANE_OIDC_ISSUER: ${KUTUPHANE_OIDC_ISSUER:-}
      KUTUPHANE_OIDC_AUDIENCE: ${KUTUPHANE_OIDC_AUDIENCE:-kutuphane}
      KUTUPHANE_OIDC_JWKS: /run/kutuphane/jwks.json
      KUTUPHANE_ANSWER_MODEL: ${KUTUPHANE_ANSWER_MODEL:-}
      KUTUPHANE_LLMDAP_URL: ${KUTUPHANE_LLMDAP_URL:-http://llmdap:8787}
      KUTUPHANE_LLMDAP_ROUTE: ${KUTUPHANE_LLMDAP_ROUTE:-}
      KUTUPHANE_LLMDAP_KEY: ${KUTUPHANE_LLMDAP_KEY:-}
      KUTUPHANE_LLMDAP_ROUTE_CLASS: ${KUTUPHANE_LLMDAP_ROUTE_CLASS:-local}
      KUTUPHANE_LLMDAP_EMBED_ROUTE: ${KUTUPHANE_LLMDAP_EMBED_ROUTE:-}
      KUTUPHANE_LLMDAP_EMBED_ROUTE_CLASS: ${KUTUPHANE_LLMDAP_EMBED_ROUTE_CLASS:-local}
      KUTUPHANE_EMBED_MODEL: ${KUTUPHANE_EMBED_MODEL:-}
      KUTUPHANE_LLMDAP_RERANK_ROUTE: ${KUTUPHANE_LLMDAP_RERANK_ROUTE:-}
      KUTUPHANE_LLMDAP_RERANK_ROUTE_CLASS: ${KUTUPHANE_LLMDAP_RERANK_ROUTE_CLASS:-local}
      KUTUPHANE_RERANK_MODEL: ${KUTUPHANE_RERANK_MODEL:-}
    volumes:
      - ${KUTUPHANE_OIDC_JWKS_FILE:-./deploy/jwks.json}:/run/kutuphane/jwks.json:ro
    networks: [db, web, gateway]
    depends_on:
      postgres: {condition: service_healthy}

  ingress:
    profiles: [app]
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KUTUPHANE_BIND:-127.0.0.1}:8080:8080"
    networks: [edge, web]
    depends_on: [core]

  llmdap:
    profiles: [app]
    # LLMDAP's bridge-only image (LLMDAP #237): loaded from its release tarball or built from the LLMDAP repo
    # (`docker build -f deploy/bridge/Dockerfile .`). Never a moving tag.
    image: ${LLMDAP_BRIDGE_IMAGE:-llmdap-bridge:0.28.0-llmdap1.18.0}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: deploy/llmdap/bridge.env
    volumes:
      - llmdap-audit:/var/lib/llmdap/audit        # the signed chain (AT-09): back it up
      - ./deploy/llmdap/config:/etc/llmdap:ro       # routes.json, policy.csv, keys.json (hashes only)
    networks: [gateway, models]
    stop_grace_period: 35s

  model-stub:
    profiles: [dev-models]
    image: python:3.12-slim
    command: ["python", "-I", "/srv/model_stub.py"]
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./deploy/model_stub.py:/srv/model_stub.py:ro
    networks: [models]
  laya:
    profiles: [decision-models]
    # Typed-decision model (Laya 0.4.6, open weights) behind the LLMDAP `systemone` route `laya` (#225).
    build: deploy/laya
    image: kutuphane-laya:0.4.6
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      # "multilingual" must be the Hub repo convaiinnovations/laya-multilingual (pinned revision e4e9ddf),
      # not the built-in subfolder of convaiinnovations/laya; Laya serves it as model "multilingual".
      LAYA_EXTRA_MODELS: '{"laya-multilingual": "convaiinnovations/laya-multilingual"}'
      LAYA_MODELS: laya-multilingual
      LAYA_DEFAULT_MODEL: laya-multilingual
      LAYA_REVISION: reviewed      # load only the reviewed commit SHA (laya.revisions.PINNED_REVISIONS)
      LAYA_THREADS: "8"
      LAYA_DEVICE: cpu
    volumes:
      - ${HF_CACHE:-~/.cache/huggingface}:/hf:ro   # pinned Hub revision; the container has no network out
    networks: [models]
  # Real model servers (vLLM, Ollama, ...) join `models` only; the routes in deploy/llmdap/config/routes.json name them.

volumes:
  pgdata:
  llmdap-audit:

networks:
  db: {internal: true}
  web: {internal: true}
  gateway: {internal: true}
  models: {internal: true}
  edge: {}
  dev: {}
