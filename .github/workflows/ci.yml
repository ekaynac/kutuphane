name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: kutuphane
          POSTGRES_PASSWORD: kutuphane
          POSTGRES_DB: kutuphane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kutuphane -d kutuphane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KUTUPHANE_TEST_DSN: postgresql://kutuphane:kutuphane@127.0.0.1:5432/kutuphane_test
      PGPASSWORD: kutuphane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Create the extensions
        run: |
          psql -h 127.0.0.1 -U kutuphane -d kutuphane_test -c "CREATE EXTENSION IF NOT EXISTS vector" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
      # The contract snapshot (tests/contract) runs here too: it fails when a tool, a route or an error text changes.
      - name: Core tests
        run: .venv/bin/python -m pytest -q
      - name: kstd reference tests
        working-directory: kstd/reference
        run: ../../.venv/bin/python -m pytest -q -p no:cacheprovider

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (no push)
        run: docker buildx build --file Dockerfile --tag kutuphane:ci .
