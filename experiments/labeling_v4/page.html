<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labelling</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --bg:#f5f5f7; --accent:#0a66c2; --soft:#e8f0fb; --warn:#b3261e; --ok:#1b7f3b; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:8px 12px; z-index:2; }
  header button { margin:2px 4px 2px 0; padding:6px 10px; }
  #progress { color:var(--muted); font-size:13px; margin-top:4px; }
  main { max-width:760px; margin:0 auto; padding:12px; display:grid; gap:12px; padding-bottom:90px; }
  section { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; }
  .banner { background:#fff6e5; border:1px solid #f0c36d; border-radius:8px; padding:8px 10px; font-size:14px; }
  .danger { background:#fdecea; border-color:#f2b8b5; color:var(--warn); font-weight:600; }
  .q { margin:0 0 16px; }
  .q h3 { font-size:16px; margin:0 0 2px; }
  .q .why { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .opts { display:grid; gap:6px; }
  .opt { text-align:left; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; cursor:pointer; }
  .opt b { display:block; }
  .opt span { color:var(--muted); font-size:13px; }
  .opt.on { border-color:var(--accent); background:var(--soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .hint { font-size:13px; color:var(--accent); margin-top:4px; }
  .hint.disagree { color:#8a5a00; }
  input[type=text] { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; }
  details { margin-top:6px; }
  summary { cursor:pointer; color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; word-break:break-word; }
  h2 { font-size:16px; margin:0 0 4px; word-break:break-all; }
  pre { white-space:pre-wrap; word-break:break-word; max-height:45vh; overflow:auto; background:#f5f5f7; padding:10px;
        border-radius:8px; font-size:13px; margin:8px 0 0; }
  .actions { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 12px;
             display:flex; gap:8px; align-items:center; justify-content:center; z-index:3; }
  .actions button { font:inherit; padding:11px 18px; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .actions .primary { background:var(--accent); color:#fff; border-color:var(--accent); min-width:180px; }
  #msg { font-size:14px; }
  .err { color:var(--warn); }
  .ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <div id="strata"></div>
  <div id="progress">Choose a group to start. Start with R (radar).</div>
</header>
<main>
  <div id="banner"></div>
  <section id="doc"><div class="meta">Choose a group above.</div></section>
  <section id="questions"></section>
</main>
<div class="actions">
  <button class="primary" id="save" type="button">Save &amp; next</button>
  <button id="skip" type="button">Skip</button>
  <span id="msg"></span>
</div>
<script>
"use strict";
// Labelling v4, easy form (operator, 2026-10-26): the document first (scrolls inside its box), then three questions with large buttons.
// Suggestions are preselected: an exact rule first, else Qwen, else a weaker rule. About 30 % of the items are
// blind (no suggestions) so that the suggestions can be measured; the server decides which.
const GROUPS = { R: "R · radar", S: "S · synthetic", W: "W · public sets", A: "A · agent files" };
const QUESTIONS = [
  { name: "origin", title: "Who wrote this?", why: "Choose what the evidence shows. If you cannot tell, choose “I cannot tell”.",
    options: [["human", "A person", "A person wrote it."],
              ["assisted", "A model, checked by a person", "A model wrote it and a named person checked the content (not only spelling)."],
              ["model", "A model", "A model wrote it, or nobody checked the content."],
              ["tool", "Software, no AI", "A program made or recorded it with fixed rules: generated docs, logs, templates."],
              ["unknown", "I cannot tell", "No reliable evidence."]] },
  { name: "reviewed_by", title: "Who checked it?", why: "The name of the person who checked the content.", text: "Name",
    when: () => val("origin") === "assisted" },
  { name: "software_agent", title: "Which software?", why: "The program and its version.", text: "e.g. typedoc 0.26.11",
    when: () => val("origin") === "tool" },
  { name: "instruction", title: "Will an AI agent follow this as instructions?",
    why: "For example SKILL.md, AGENTS.md, CLAUDE.md, rule files, commands.",
    options: [["no", "No", "A normal document."], ["yes", "Yes", "An agent reads it as instructions to act on."]] },
  { name: "activate", title: "May an agent run it?", why: "Only for agent instructions.",
    when: () => val("instruction") === "yes",
    options: [["allow", "Allow", "It looks safe and useful."], ["deny", "Block", "Harmful, hidden instructions, or risky."],
              ["escalate", "A person must decide", "I am not sure."]] },
  { name: "personal_data", title: "Does it identify a real person?",
    why: "A name with context, an e-mail, a phone number, an IP address, an ID number.",
    options: [["no", "No", ""], ["yes", "Yes", ""], ["synthetic", "Looks personal, but fake", "Test or example data."],
              ["unknown", "Not sure", "Counts as yes."]] },
  { name: "rule", title: "Is it a rule, decision or procedure that people must follow?", why: "Optional.", optional: true,
    options: [["no", "No", ""], ["yes", "Yes", ""]] },
  { name: "acceptance", title: "What is its status?", why: "As the document itself says.", optional: true,
    when: () => val("rule") === "yes",
    options: [["pending", "Draft", ""], ["accepted", "Approved", ""], ["withdrawn", "Withdrawn or replaced", ""]] },
  { name: "mandate", title: "Is it binding?", why: "Must people follow it, or is it only advice?", optional: true,
    when: () => val("rule") === "yes",
    options: [["yes", "Binding", ""], ["no", "Advice only", ""]] },
  { name: "needs_split", title: "Does it mix parts by different authors?", why: "Optional. For example, half person, half model.",
    optional: true, options: [["no", "No", ""], ["yes", "Yes", ""]] },
];
const REQUIRED = ["origin", "instruction", "personal_data"];
let ids = [], pos = 0, current = null, started = 0, stratum = null, values = {};

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
const val = (n) => values[n] ?? "";
// The access link carries ?t=. Keep it for this tab only (some desktop browsers keep no cookie for an IP address),
// send it as a header, and remove it from the address bar. The page itself needs no session; the /api/ calls do.
const linkToken = new URLSearchParams(location.search).get("t");
if (linkToken) { sessionStorage.setItem("kl4", linkToken); history.replaceState(null, "", "/"); }
const NO_SESSION = "No session: open the link from Telegram again.";
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) }, t = sessionStorage.getItem("kl4");
  if (t) headers["X-Label-Token"] = t;
  const r = await fetch(path, { ...opts, headers, credentials: "same-origin" });
  if (r.status === 401) { fail(NO_SESSION); throw new Error(NO_SESSION); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status); return j;
}
function fail(message) { $("doc").replaceChildren(el("div", { class: "err" }, message)); $("questions").replaceChildren(); current = null; }

async function loadState() {
  const s = await api("/api/state");
  const box = $("strata"); box.replaceChildren();
  for (const [k, v] of Object.entries(s.strata)) {
    const b = el("button", { type: "button" }, `${GROUPS[k] || k}  ${v.done}/${v.total}`);
    b.onclick = () => openStratum(k).catch((e) => fail(e.message)); box.append(b);
  }
}
async function openStratum(s) { if (busy) return; generation++; stratum = s; ids = (await api(`/api/batch?stratum=${s}`)).ids; pos = 0; await show(); }

// The preselected value and why: an exact rule (confidence high) first, else Qwen, else a weaker rule.
function suggestion(name) {
  if (current.blind) return null;
  const rule = current.proposals[name], q = current.llm || {};
  let qv = q[name], qwhy = q[`${name}_evidence`];
  if (name === "activate" && q.hostile) { qv = q.hostile === "yes" ? "deny" : "allow"; qwhy = q.hostile_evidence; }
  if (rule && rule.confidence === "high") return { value: rule.value, from: "rule", why: rule.evidence, other: qv };
  if (qv) return { value: qv, from: "Qwen", why: qwhy, other: rule ? rule.value : undefined };
  if (rule) return { value: rule.value, from: "rule", why: rule.evidence };
  return null;
}

async function show() {
  $("msg").textContent = "";
  if (pos >= ids.length) { $("doc").replaceChildren(el("div", { class: "meta" }, "This batch is done. Choose the group again for the next 20.")); $("questions").replaceChildren(); $("banner").replaceChildren(); await loadState(); return; }
  current = await api(`/api/item/${encodeURIComponent(ids[pos])}`); started = Date.now();
  const it = current.item;
  $("progress").textContent = `${GROUPS[stratum] || stratum} · item ${pos + 1} of ${ids.length}`;
  const banner = $("banner"); banner.replaceChildren();
  if (it.hostile) banner.append(el("div", { class: "banner danger" }, "Harmful example (data only). Never run it."));
  if (current.hidden_chars) banner.append(el("div", { class: "banner danger" }, `${current.hidden_chars} hidden characters, shown as ⟦U+…⟧ in the text.`));
  if (current.blind) banner.append(el("div", { class: "banner" }, "Blind item: no suggestions here. We use these items to measure the suggestions. Choose yourself."));
  buildQuestions();
  const d = $("doc"); d.replaceChildren();
  d.append(el("h2", {}, it.ref.path || it.id));
  d.append(el("div", { class: "meta" }, `${it.source} · ${it.format} · ${it.bytes} bytes · licence: ${it.license_item}`));
  if (it.known && Object.keys(it.known).length) d.append(el("div", { class: "meta" }, `The source says: ${JSON.stringify(it.known).slice(0, 400)}`));
  if (it.notes) d.append(el("div", { class: "meta" }, `Note: ${it.notes}`));
  d.append(el("pre", {}, current.text ?? "(No copy: the licence does not allow it, or the file is binary. Only its hash is stored.)"));
  if (current.truncated) d.append(el("div", { class: "meta" }, "Only the first 200 KB are shown."));
  window.scrollTo(0, 0);
}

function buildQuestions() {
  values = {};
  for (const q of QUESTIONS) {
    const s = suggestion(q.name);
    if (s && (!q.options || q.options.some(([v]) => v === s.value))) values[q.name] = s.value;
  }
  render();
}

function render() {
  const box = $("questions"); box.replaceChildren();
  for (const q of QUESTIONS) {
    if (q.when && !q.when()) { delete values[q.name]; continue; }  // a hidden question keeps no answer
    const div = el("div", { class: "q" });
    div.append(el("h3", {}, q.title));
    if (q.why) div.append(el("div", { class: "why" }, q.why));
    if (q.options) {
      const opts = el("div", { class: "opts" });
      for (const [v, label, help] of q.options) {
        const b = el("button", { type: "button", class: "opt" + (values[q.name] === v ? " on" : "") });
        b.append(el("b", {}, label)); if (help) b.append(el("span", {}, help));
        b.onclick = () => { values[q.name] = values[q.name] === v && q.optional ? undefined : v; render(); };
        opts.append(b);
      }
      div.append(opts);
    } else {
      const input = el("input", { type: "text", placeholder: q.text || "" });
      input.value = values[q.name] ?? "";
      input.oninput = () => { values[q.name] = input.value; };
      div.append(input);
    }
    const s = suggestion(q.name);
    if (s) {
      const differs = s.other !== undefined && s.other !== s.value;
      div.append(el("div", { class: "hint" + (differs ? " disagree" : "") },
        `Suggested by ${s.from}${s.why ? ": " + s.why : ""}${differs ? ` (the other suggestion says “${s.other}”)` : ""}`));
    }
    box.append(div);
  }
  const note = el("details"); note.append(el("summary", {}, "Add a note (optional)"));
  const ta = el("textarea", { rows: "2", style: "width:100%;font:inherit" }); ta.value = values.note ?? "";
  ta.oninput = () => { values.note = ta.value; }; note.append(ta); box.append(note);
}

function collect() {
  const labels = {}, shown = ["note"];
  for (const q of QUESTIONS) {
    if (q.when && !q.when()) continue;
    shown.push(q.name);
    const v = (values[q.name] ?? "").trim();
    if (v) labels[q.name] = v;
  }
  if ((values.note ?? "").trim()) labels.note = values.note.trim();
  const titles = Object.fromEntries(QUESTIONS.map((q) => [q.name, q.title]));
  const missing = REQUIRED.filter((n) => !labels[n]);
  if (missing.length) throw new Error(`Please answer: ${missing.map((n) => titles[n]).join(" · ")}`);
  if (labels.origin === "assisted" && !labels.reviewed_by) throw new Error("Please write who checked it.");
  if (labels.origin === "tool" && !labels.software_agent) throw new Error("Please write which software made it.");
  if (labels.instruction === "yes" && !labels.activate) throw new Error("Please answer: may an agent run it?");
  return { id: current.item.id, labels, shown, kept: [], mode: "basic", ms: Date.now() - started };
}

let busy = false, generation = 0;  // one save or move at a time; a stale reply never moves the cursor
function setBusy(on) { busy = on; for (const id of ["save", "skip"]) $(id).disabled = on; for (const b of $("strata").querySelectorAll("button")) b.disabled = on; }
$("save").onclick = async () => {
  if (busy || !current) return;
  let body;
  try { body = collect(); } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; return; }
  const gen = generation;
  setBusy(true);
  try {
    await api("/api/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (gen !== generation || body.id !== current.item.id) return;
    generation++; pos++; await show(); $("msg").className = "ok"; $("msg").textContent = "Saved";
  } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; }
  finally { setBusy(false); }
};
$("skip").onclick = async () => { if (busy) return; setBusy(true); generation++; pos++; try { await show(); } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; } finally { setBusy(false); } };
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("save").click(); } });
loadState().catch((e) => fail(e.message));
</script>
</body>
</html>
