<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiketleme v4</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --bg:#fbfbfd; --accent:#0a66c2; --warn:#b3261e; --ok:#1b7f3b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:8px 12px; z-index:2; }
  header .strata button { margin:2px 4px 2px 0; }
  main { max-width:1100px; margin:0 auto; padding:12px; display:grid; gap:12px; }
  @media (min-width:900px) { main { grid-template-columns: 1.2fr 1fr; } }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  h2 { font-size:15px; margin:0 0 6px; }
  .meta { color:var(--muted); font-size:13px; word-break:break-all; }
  pre { white-space:pre-wrap; word-break:break-word; max-height:60vh; overflow:auto; background:#f5f5f7; padding:8px;
        border-radius:6px; font-size:12.5px; margin:8px 0 0; }
  .hostile { color:var(--warn); font-weight:600; }
  label.f { display:block; margin:6px 0 2px; font-weight:600; font-size:13px; }
  select, input[type=text], textarea { width:100%; font:inherit; padding:5px 6px; border:1px solid var(--line); border-radius:6px; }
  .row { display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; }
  .prop { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .prop.on { color:var(--accent); }
  .prop.kept { color:var(--warn); }
  .prop.kept button { padding:2px 8px; font-size:12.5px; }
  .actions { display:flex; gap:8px; margin-top:12px; position:sticky; bottom:0; background:#fff; padding:8px 0; }
  button { font:inherit; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .err { color:var(--warn); }
  .ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <div class="strata" id="strata"></div>
  <div class="meta" id="progress"></div>
</header>
<main>
  <section id="view"><div class="meta">Bir katman seçin.</div></section>
  <section>
    <form id="form" autocomplete="off"></form>
    <div class="actions">
      <button class="primary" id="save" type="button">Kaydet ve sonraki</button>
      <button id="skip" type="button">Atla</button>
      <span id="msg"></span>
    </div>
  </section>
</main>
<script>
"use strict";
const HELP = {
  origin: "Bu metni kim yazdı? human: bir kişi · assisted: model yazdı, adı belli bir kişi içeriği inceledi · model: model yazdı (inceleme yok ya da yalnız yazım düzeltmesi) · tool: yazılım kurallarla üretti ya da kaydetti (typedoc, log, şablon) · unknown: kanıt yok",
  personal_data: "Gerçek bir kişiyi tanıtan bilgi var mı (ad + bağlam, e-posta, IP, telefon, kimlik no)? synthetic: kişi bilgisine benziyor ama gerçek kişi yok · unknown: emin değilim (= yes sayılır)",
  instruction: "Bir yapay zekâ ajanı bu dosyayı talimat olarak izler mi? (SKILL.md, AGENTS.md, kurallar, komutlar)",
  activate: "Ajan bunu çalıştırabilir mi? allow · deny (zararlı ya da riskli) · escalate (bir kişi karar versin)",
  rule: "İsteğe bağlı. Belge, kişilerin ya da ajanların uyması gereken bir kural, karar ya da prosedür içeriyorsa 'yes' seçin; kabul, yetki ve geçerlilik alanları açılır.",
  acceptance: "Belgenin kendi durumu: taslak = pending · onaylı = accepted · eskimiş/geri çekilmiş = withdrawn",
  mandate: "Bu kural bağlayıcı mı (uyulmak zorunda mı)?",
  ai_use: "Belge kendisi belirtmiyorsa boş bırakın; boş, 'n' ile aynı değildir",
  needs_split: "İsteğe bağlı. Dosyada farklı kökenli parçalar var mı (ör. yarısı kişi, yarısı model)?",
};
const LABELS = { rule:"Kural / karar mı?", origin:"Köken", reviewed_by:"İnceleyen kişi", software_agent:"Yazılım + sürüm",
  personal_data:"Kişisel veri", license_item:"Öğe lisansı", acceptance:"Kabul durumu", mandate:"Bağlayıcı mı?",
  export:"Dışa aktarma", route:"Rota", valid_from:"Geçerlilik başlangıcı", valid_to:"Geçerlilik sonu",
  applies_to:"Kapsam (neye/kime uygulanır)", inputs:"Kaynak öğeler (id, virgülle)", instruction:"Ajan talimatı mı?",
  activate:"Çalıştırma izni", needs_split:"Bölünmeli mi?", note:"Not" };
let choices = {}, ids = [], pos = 0, current = null, started = 0, stratum = null;

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
// The access link carries ?t=. Keep it for this tab only (some desktop browsers keep no cookie for an IP address),
// send it as a header, and remove it from the address bar. The page itself is served without a session, so a
// reload works from sessionStorage alone; only the /api/ calls are authenticated.
const linkToken = new URLSearchParams(location.search).get("t");
if (linkToken) { sessionStorage.setItem("kl4", linkToken); history.replaceState(null, "", "/"); }
const NO_SESSION = "Oturum yok: Telegram'daki bağlantıyı yeniden açın.";
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) }, t = sessionStorage.getItem("kl4");
  if (t) headers["X-Label-Token"] = t;
  const r = await fetch(path, { ...opts, headers, credentials: "same-origin" });
  if (r.status === 401) { fail(NO_SESSION); throw new Error(NO_SESSION); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status); return j;
}
function fail(message) { $("view").replaceChildren(el("div", { class: "err" }, message)); $("form").replaceChildren(); current = null; }

async function loadState() {
  const s = await api("/api/state"); choices = s.choices;
  const box = $("strata"); box.replaceChildren();
  for (const [k, v] of Object.entries(s.strata)) {
    const b = el("button", { type: "button" }, `${k} ${v.done}/${v.total}`);
    b.onclick = () => openStratum(k).catch((e) => fail(e.message)); box.append(b);
  }
}
async function openStratum(s) { if (busy) return; generation++; stratum = s; ids = (await api(`/api/batch?stratum=${s}`)).ids; pos = 0; await show(); }

function selectFor(name, options, value) {
  const sel = el("select", { name });
  for (const o of options) sel.append(el("option", { value: o }, o === "" ? "(belirtilmemiş)" : o));
  sel.value = value ?? options[0]; return sel;
}
function field(form, name, input, proposal) {
  form.append(el("label", { class: "f", for: name }, LABELS[name] || name));
  input.id = name; form.append(input);
  if (HELP[name]) form.append(el("div", { class: "prop" }, HELP[name]));
  if (proposal) form.append(el("div", { class: "prop on" }, `kural: ${JSON.stringify(proposal.value)} (${proposal.confidence}) — ${proposal.evidence}`));
  const q = current && current.llm;
  const qv = q && (name === "activate" ? (q.hostile === "yes" ? "deny" : null) : q[name]);
  if (qv) form.append(el("div", { class: "prop on" }, `Qwen: ${qv}${q[`${name === "activate" ? "hostile" : name}_evidence`] ? " — " + q[`${name === "activate" ? "hostile" : name}_evidence`] : ""}`));
}

async function show() {
  $("msg").textContent = "";
  if (pos >= ids.length) { $("view").replaceChildren(el("div", { class: "meta" }, "Bu grup bitti. Katmanı yeniden seçin.")); $("form").replaceChildren(); await loadState(); return; }
  current = await api(`/api/item/${encodeURIComponent(ids[pos])}`); started = Date.now();
  const it = current.item, p = current.proposals;
  $("progress").textContent = `${stratum}: ${pos + 1}/${ids.length} · ${it.id}`;
  const v = $("view"); v.replaceChildren();
  v.append(el("h2", {}, it.ref.path || it.id));
  v.append(el("div", { class: "meta" }, `${it.source} · ${it.format} · ${it.bytes} B · lisans öğe: ${it.license_item} · koleksiyon: ${it.license_collection ?? "—"}`));
  if (it.url) v.append(el("div", { class: "meta" }, it.url));
  if (it.hostile) v.append(el("div", { class: "hostile" }, "Zararlı örnek (veri): asla çalıştırmayın."));
  if (current.hidden_chars) v.append(el("div", { class: "hostile" }, `${current.hidden_chars} gizli karakter ⟦U+…⟧ olarak gösterildi.`));
  if (current.siblings.length) v.append(el("div", { class: "meta" }, `Aynı klasör: ${current.siblings.length} dosya (${it.group})`));
  if (it.notes) v.append(el("div", { class: "meta" }, `Not: ${it.notes}`));
  if (it.known && Object.keys(it.known).length) v.append(el("div", { class: "meta" }, `Kaynağın beyanı: ${JSON.stringify(it.known).slice(0, 600)}`));
  v.append(el("pre", {}, current.text ?? "(içerik kopyalanmadı: lisans izin vermiyor ya da ikili dosya; özet ve sha256 kayıtlı)"));
  if (current.truncated) v.append(el("div", { class: "meta" }, "İlk 200 KB gösteriliyor."));

  if (current.blind) v.prepend(el("div", { class: "meta" }, "Kör örnek: bu öğede öneriler gizli (önericileri ölçmek için). Kendi kararınızı verin."));
  buildForm(it, p);
}

// --- the form: 3 required questions; other fields open by condition (docs/19). No document kind (D54, D66). ------
const val = (n) => { const e = $("form").elements[n]; return e ? e.value : ""; };
let rows = [], showAll = false, showException = false;
const AI_KEYS = ["search", "ai_input", "train"];
function hasValue(r) {
  const f = $("form").elements;
  return r.name === "ai_use" ? AI_KEYS.some((k) => f[`ai_${k}`].value) : f[r.name].value.trim() !== "";
}
// A filled field stays visible when its condition stops holding (rule flag or origin changed, a mode closed): it is
// saved as `kept` until the person clears it (Astra review #11), never dropped silently.
function keptNote(r) {
  const clear = el("button", { type: "button" }, "Temizle");
  clear.onclick = () => {
    const f = $("form").elements;
    for (const n of r.name === "ai_use" ? AI_KEYS.map((k) => `ai_${k}`) : [r.name]) f[n].value = "";
    refresh();
  };
  const box = el("div", { class: "prop kept" }, "Koşulu artık geçerli değil; değer korunuyor. ");
  box.append(clear); return box;
}

function buildForm(it, p) {
  const f = $("form"); f.replaceChildren(); rows = []; showAll = false; showException = false;
  const pv = (k) => (p[k] ? p[k].value : undefined);
  const blank = (name, options, value) => selectFor(name, ["", ...options], value ?? "");  // "" = not chosen yet
  const text = (name, value = "", ph = "") => Object.assign(el("input", { type: "text", name, placeholder: ph }), { value });
  const add = (name, input, when = () => true, proposalKey = name) => {
    const box = el("div"); box.dataset.field = name;
    field(box, name, input, p[proposalKey]); f.append(box);
    const r = { name, box, when, visible: false, kept: false }; r.note = keptNote(r); box.append(r.note); rows.push(r);
  };
  const rule = () => val("rule") === "yes";

  add("origin", blank("origin", choices.origin, pv("origin")));
  add("reviewed_by", text("reviewed_by", pv("reviewed_by") ?? ""), () => val("origin") === "assisted");
  add("software_agent", text("software_agent", "", "ad + sürüm, ör. typedoc 0.26.11"), () => val("origin") === "tool");
  add("inputs", text("inputs", "", "kaynak öğe id'leri, virgülle"), () => ["model", "tool", "assisted"].includes(val("origin")) || showAll);
  add("instruction", blank("instruction", choices.instruction, pv("instruction")));
  add("activate", blank("activate", choices.activate.filter((x) => x !== "n/a"), pv("activate")), () => val("instruction") === "yes");
  add("personal_data", blank("personal_data", choices.personal_data, pv("personal_data")));
  add("rule", blank("rule", choices.rule, ""));
  add("acceptance", blank("acceptance", choices.acceptance, pv("acceptance")), () => rule() || showAll);
  add("mandate", blank("mandate", choices.mandate, ""), () => rule() || showAll);
  add("valid_from", text("valid_from", "", "YYYY-MM-DD"), () => rule() || showAll);
  add("valid_to", text("valid_to", (pv("valid_to") || "").slice(0, 10), "YYYY-MM-DD"), () => rule() || showAll);
  add("applies_to", text("applies_to", pv("applies_to") ?? ""), () => rule() || val("instruction") === "yes" || showAll);
  // blind: no default, so an unanswered split question stays missing rather than "no" (Astra review #11)
  add("needs_split", blank("needs_split", choices.needs_split, current.blind ? "" : pv("needs_split") ?? "no"));

  // inherited rights: one summary line; an exception opens the fields
  const inherited = el("div", { class: "prop" }, `Devralınan: lisans ${it.license_item}${it.license_collection ? ` (koleksiyon ${it.license_collection})` : ""} · AI kullanımı: belirtilmemiş`);
  const exc = el("button", { type: "button" }, "İstisna (lisans / AI kullanımı)");
  exc.onclick = () => { showException = !showException; refresh(); };
  f.append(inherited, exc);
  add("license_item", text("license_item", pv("license") ?? it.license_item ?? ""), () => showException || showAll, "license");
  const aiBox = el("div"); aiBox.dataset.field = "ai_use";
  aiBox.append(el("label", { class: "f" }, "AI kullanımı (search / ai_input / train)"));
  const row = el("div", { class: "row" }); const ai = pv("ai_use") || {};
  for (const k of AI_KEYS) { const s = selectFor(`ai_${k}`, ["", "y", "n"], ai[k] ?? ""); s.title = k; row.append(s); }
  aiBox.append(row, el("div", { class: "prop" }, HELP.ai_use)); f.append(aiBox);
  const aiRow = { name: "ai_use", box: aiBox, when: () => showException || showAll, visible: false, kept: false };
  aiRow.note = keptNote(aiRow); aiBox.append(aiRow.note); rows.push(aiRow);
  add("export", blank("export", choices.export.filter(Boolean), ""), () => showAll);
  add("route", blank("route", choices.route.filter(Boolean), ""), () => showAll);

  const all = el("button", { type: "button" }, "Tüm alanlar");
  all.onclick = () => { showAll = !showAll; all.textContent = showAll ? "Az alan" : "Tüm alanlar"; refresh(); };
  const note = el("details"); note.append(el("summary", {}, "Not"), el("textarea", { name: "note", rows: "2" }));
  f.append(all, note);
  f.onchange = refresh; refresh();
}
function refresh() {
  for (const r of rows) {
    const on = r.when();
    r.kept = !on && r.visible && hasValue(r);
    r.visible = on || r.kept;
    r.box.style.display = r.visible ? "" : "none";
    r.note.style.display = r.kept ? "" : "none";
  }
}

const REQUIRED = ["origin", "instruction", "personal_data"];
// The server checks `shown` against the mode and the choices, keeps `kept`, and derives the accepted proposals.
function collect() {
  const f = $("form"), labels = {}, shown = ["note"], kept = [];
  for (const r of rows) {
    if (!r.visible) continue;
    shown.push(r.name); if (r.kept) kept.push(r.name);
    if (r.name === "ai_use") {
      const ai = {}; for (const k of AI_KEYS) { const v = f.elements[`ai_${k}`].value; if (v) ai[k] = v; }
      labels.ai_use = ai;
    } else {
      const v = f.elements[r.name].value; if (v !== "") labels[r.name] = v;
    }
  }
  if (f.elements.note.value.trim()) labels.note = f.elements.note.value;
  const missing = REQUIRED.filter((n) => !labels[n]);
  if (missing.length) throw new Error(`Seçilmedi: ${missing.map((n) => LABELS[n] || n).join(", ")}`);
  const mode = showAll ? "all" : showException ? "exception" : "basic";
  return { id: current.item.id, labels, shown, kept, mode, ms: Date.now() - started };
}
let busy = false, generation = 0;  // one save or move at a time; a stale reply never moves the cursor
function setBusy(on) { busy = on; for (const id of ["save", "skip"]) $(id).disabled = on; for (const b of $("strata").querySelectorAll("button")) b.disabled = on; }
$("save").onclick = async () => {
  if (busy || !current) return;
  let body;
  try { body = collect(); } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; return; }
  const gen = generation;
  setBusy(true);
  try {
    await api("/api/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (gen !== generation || body.id !== current.item.id) return;
    $("msg").className = "ok"; $("msg").textContent = "kaydedildi"; generation++; pos++; await show();
  } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; }
  finally { setBusy(false); }
};
$("skip").onclick = async () => { if (busy) return; setBusy(true); generation++; pos++; try { await show(); } catch (e) { $("msg").className = "err"; $("msg").textContent = e.message; } finally { setBusy(false); } };
document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); $("save").click(); } });
loadState().catch((e) => fail(e.message));
</script>
</body>
</html>
