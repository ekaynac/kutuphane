<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kütüphane Labelling</title>
<style>
/* Layout: one card at a time, thumb-reach action bar pinned to the bottom. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1d2320; --muted: #5d6762; --line: #d6dbd6;
  --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #dcefe8; --blind: #7a4b9c; --blind-soft: #efe5f6;
  --warn: #9a5b12;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1b201e; --ink: #e6ebe8; --muted: #9aa59f; --line: #2e3532;
    --accent: #5cc3a5; --accent-ink: #0d1412; --accent-soft: #1f3a32; --blind: #c49be0; --blind-soft: #33263d;
    --warn: #e0a85a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b201e; --ink: #e6ebe8; --muted: #9aa59f; --line: #2e3532;
  --accent: #5cc3a5; --accent-ink: #0d1412; --accent-soft: #1f3a32; --blind: #c49be0; --blind-soft: #33263d;
  --warn: #e0a85a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
.tabs { display: flex; gap: 6px; margin-top: 8px; }
.tab { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px; font: inherit; font-size: 13px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
main { padding: 12px 16px; max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.chip.blind { color: var(--blind); background: var(--blind-soft); border-color: transparent; }
.chip.draft { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.done { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
.path { font: 12px/1.35 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.doc pre { margin: 0; padding: 12px; max-height: 42vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--mono); }
.doc .more { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 6px 12px; font-size: 12px; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; padding: 6px 0; cursor: pointer; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
legend { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; padding: 0; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { position: relative; min-height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 6px; font: inherit; font-size: 13px; line-height: 1.2; text-align: left; cursor: pointer; }
.opt b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt[aria-pressed="true"] b { color: var(--accent-ink); }
.opt.suggested::after { content: "suggested"; position: absolute; top: 3px; right: 5px; font-size: 9px; letter-spacing: .05em; text-transform: uppercase; opacity: .75; }
.opt:focus-visible, .tab:focus-visible, .act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.desc { font-size: 12.5px; color: var(--muted); min-height: 1.4em; }
.why { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; }
input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px; font: inherit; }
.q { font-size: 18px; line-height: 1.35; font-weight: 600; text-wrap: balance; margin: 0; }
blockquote { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: center; }
.act { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; min-height: 48px; padding: 0 14px; font: inherit; font-weight: 600; cursor: pointer; }
.act.primary { flex: 1; max-width: 420px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.act:disabled { opacity: .45; cursor: default; }
.msg { font-size: 13px; color: var(--warn); min-height: 1.2em; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.opt:disabled { opacity: .4; cursor: not-allowed; }
.desc b { color: var(--ink); font-weight: 600; }
.reveal { font-size: 13px; background: var(--blind-soft); color: var(--ink); border-radius: 8px; padding: 8px 10px; }
.guide-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(720px, calc(100vw - 32px)); max-height: 85vh; }
dialog::backdrop { background: rgb(0 0 0 / .45); }
.guide { padding: 14px 16px 18px; overflow: auto; max-height: 85vh; }
.guide h2 { font-size: 15px; margin: 16px 0 6px; }
.guide h2:first-of-type { margin-top: 4px; }
.guide dl { margin: 0; display: grid; gap: 10px; }
.guide dt { font-weight: 700; }
.guide dd { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }
.guide dd span { display: block; }
.guide .rule { font-size: 13.5px; border-left: 3px solid var(--accent); padding-left: 10px; margin: 8px 0; }
.guide-close { position: sticky; top: 0; float: right; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="head-row"><h1>Kütüphane · labelling</h1><span class="meta"><span id="count"></span><button class="guide-btn" id="btn-guide" type="button">Guide</button></span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-doc" aria-selected="true">Documents</button>
    <button class="tab" role="tab" id="tab-qa" aria-selected="false">Question–passage</button>
  </div>
  <div class="bar"><i id="progress"></i></div>
</header>
<main id="main"><p class="empty">Loading…</p></main>
<dialog id="guide" aria-label="Label guide"><div class="guide" id="guide-body"></div></dialog>
<div class="actions">
  <button class="act" id="btn-prev" aria-label="Previous">‹</button>
  <button class="act" id="btn-skip">Skip</button>
  <button class="act primary" id="btn-save">Save</button>
  <button class="act" id="btn-next" aria-label="Next">›</button>
</div>
<script>
"use strict";
const S = { tax: null, docs: [], qa: [], labels: {}, tab: "doc", idx: { doc: 0, qa: 0 }, sel: {}, shownAt: 0, revealed: null };
// A restricted document must stay local (the product refuses restricted + cloud): keep the two answers consistent.
const RESTRICTED_LOCAL = true;
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.flat().forEach(k => n.append(k)); return n; };

async function api(path, opts) {
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

function list() { return S.tab === "doc" ? S.docs : S.qa; }
function current() { return list()[S.idx[S.tab]]; }
function isDone(item) { const l = S.labels[item.id]; return !!l; }
function firstOpen(items) { const i = items.findIndex(x => !isDone(x)); return i < 0 ? 0 : i; }

function header() {
  const items = list(); const done = items.filter(isDone).length;
  $("count").textContent = `${done}/${items.length}`;
  $("progress").style.width = items.length ? `${(100 * done / items.length).toFixed(1)}%` : "0";
  $("tab-doc").setAttribute("aria-selected", String(S.tab === "doc"));
  $("tab-qa").setAttribute("aria-selected", String(S.tab === "qa"));
  $("tab-doc").textContent = `Documents ${S.docs.filter(isDone).length}/${S.docs.length}`;
  $("tab-qa").textContent = `Question–passage ${S.qa.filter(isDone).length}/${S.qa.length}`;
}

function optButtons(qkey, spec, draftVal, two) {
  const wrap = el("div", { className: "opts" + (two ? " two" : "") });
  const desc = el("div", { className: "desc" });
  const paint = () => {
    for (const b of wrap.children) {
      b.setAttribute("aria-pressed", String(b.dataset.v === S.sel[qkey]));
      b.disabled = RESTRICTED_LOCAL && qkey === "egress" && b.dataset.v === "cloud_ok" && S.sel.sensitivity === "restricted";
    }
    const o = spec.options[S.sel[qkey]];
    desc.replaceChildren(...(o ? [o.desc, " ", el("b", { textContent: o.not || "" })] : ["Select one. Open the Guide for the differences."]));
  };
  wrap.paint = paint;
  for (const [v, o] of Object.entries(spec.options)) {
    const b = el("button", { className: "opt" + (v === draftVal ? " suggested" : ""), type: "button" });
    b.dataset.v = v;
    if (/^K\d$/.test(v)) b.append(el("b", { textContent: v }), o.name); else b.append(o.name);
    b.addEventListener("click", () => {
      S.sel[qkey] = v;
      if (RESTRICTED_LOCAL && qkey === "sensitivity" && v === "restricted") S.sel.egress = "local_only";
      document.querySelectorAll(".opts").forEach(w => w.paint && w.paint());
    });
    wrap.append(b);
  }
  paint();
  return el("fieldset", {}, el("legend", { textContent: spec.label }), wrap, desc);
}

function renderDoc(item) {
  const prev = S.labels[item.id];
  const d = item.draft;
  S.sel = prev && !prev.skip ? { ...prev.values } : d ? { category: d.category, sensitivity: d.sensitivity, egress: d.egress } : {};
  if (RESTRICTED_LOCAL && S.sel.sensitivity === "restricted") S.sel.egress = "local_only";
  S.note = prev ? prev.note || "" : "";
  const meta = el("div", { className: "meta" },
    el("span", { className: "chip", textContent: item.id }),
    el("span", { className: "chip", textContent: item.group }),
    item.blind ? el("span", { className: "chip blind", textContent: "blind" }) : d ? el("span", { className: "chip draft", textContent: "suggestion" }) : el("span", { className: "chip", textContent: "no suggestion" }),
    prev ? el("span", { className: "chip done", textContent: prev.skip ? "skipped" : "labelled" }) : "");
  const pre = el("pre", { textContent: item.excerpt });
  const more = el("div", { className: "more" }, el("span", { textContent: `${item.chars.toLocaleString("en-US")} characters` }));
  if (item.chars > item.excerpt.length) {
    const b = el("button", { className: "linkbtn", type: "button", textContent: "Show all" });
    b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "Loading…";
      try { const full = await api(`/api/doc/${item.id}`); pre.textContent = full.text; pre.style.maxHeight = "70vh"; b.remove(); }
      catch (e) { b.disabled = false; b.textContent = "Failed. Try again"; }
    });
    more.append(b);
  }
  const t = S.tax.questions;
  const note = el("input", { type: "text", id: "note", placeholder: "Note (optional). For 'Does not fit', write what the document is.", value: S.note, maxLength: 500 });
  note.addEventListener("input", () => { S.note = note.value; });
  const revealed = S.revealed;
  S.revealed = null;
  return [revealed ? el("div", { className: "reveal", textContent: revealed }) : "",
    meta, el("div", { className: "path", textContent: item.path }), el("div", { className: "doc" }, pre, more),
    d ? el("div", { className: "why", textContent: `${item.blind ? "Suggestion (shown after your label)" : "Reason for the suggestion"}: ${d.rationale || "—"}` }) : "",
    optButtons("category", t.category, d && d.category), optButtons("sensitivity", t.sensitivity, d && d.sensitivity, true),
    optButtons("egress", t.egress, d && d.egress, true), note, el("div", { className: "msg", id: "msg" })];
}

function renderQa(item) {
  const prev = S.labels[item.id];
  S.sel = prev ? { ...prev.values } : {};
  const rel = S.tax.relevance;
  const wrap = el("div", { className: "opts two" });
  for (const [v, name] of Object.entries(rel.options)) {
    const b = el("button", { className: "opt", type: "button", title: (rel.help || {})[v] || "" });
    b.append(name, el("b", { textContent: (rel.help || {})[v] || "", style: "font-weight:400;margin-top:2px" }));
    b.setAttribute("aria-pressed", String(S.sel.relevance === v));
    b.addEventListener("click", () => { S.sel.relevance = v; save(); });
    wrap.append(b);
  }
  return [el("div", { className: "meta" }, el("span", { className: "chip", textContent: item.doc }), prev ? el("span", { className: "chip done", textContent: "labelled" }) : ""),
    el("p", { className: "q", textContent: item.question }), el("blockquote", { textContent: item.passage }),
    el("div", { className: "path", textContent: item.path }),
    el("fieldset", {}, el("legend", { textContent: rel.label }), wrap), el("div", { className: "msg", id: "msg" })];
}

function render() {
  header();
  const items = list(); const main = $("main"); main.replaceChildren();
  $("btn-save").hidden = S.tab === "qa";
  if (!items.length) {
    main.append(el("p", { className: "empty", textContent: S.tab === "qa" ? "No question–passage items yet. Reload the page later." : "No documents." }));
    return;
  }
  const item = current();
  main.append(...(S.tab === "doc" ? renderDoc(item) : renderQa(item)));
  $("btn-prev").disabled = S.idx[S.tab] === 0;
  $("btn-next").disabled = S.idx[S.tab] >= items.length - 1;
  S.shownAt = performance.now();
  window.scrollTo({ top: 0 });
}

function go(delta) { const n = list().length; S.idx[S.tab] = Math.max(0, Math.min(n - 1, S.idx[S.tab] + delta)); render(); }
function advance() { const items = list(); const i = items.findIndex((x, k) => k > S.idx[S.tab] && !isDone(x)); S.idx[S.tab] = i < 0 ? firstOpen(items) : i; render(); }

async function save(skip = false) {
  const item = current(); if (!item) return;
  const body = { task: S.tab, id: item.id, values: S.sel, note: S.note || "", ms: Math.round(performance.now() - S.shownAt), draft_shown: !!item.draft };
  if (skip) { body.skip = true; body.values = { category: null, sensitivity: null, egress: null }; }
  if (S.tab === "doc" && !skip && (!S.sel.category || !S.sel.sensitivity || !S.sel.egress)) { $("msg").textContent = "Answer all three questions, or push Skip."; return; }
  if (S.tab === "qa" && skip) { advance(); return; }
  try {
    const res = await api("/api/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    S.labels[item.id] = { ...body, skip };
    if (item.blind && res.draft) {  // blind item: the suggestion becomes visible only now, after the label
      item.draft = res.draft;
      const name = (q, v) => (S.tax.questions[q].options[v] || {}).name || v;
      const same = ["category", "sensitivity", "egress"].every(q => res.draft[q] === S.sel[q]);
      S.revealed = `Blind ${item.id} saved. Suggestion was: ${res.draft.category} ${name("category", res.draft.category)} · ${name("sensitivity", res.draft.sensitivity)} · ${name("egress", res.draft.egress)}${same ? " (same as your label)" : ""}.`;
    }
    advance();
  } catch (e) { const m = $("msg"); if (m) m.textContent = `Not saved: ${e.message}. Check the connection and try again.`; }
}

$("btn-prev").addEventListener("click", () => go(-1));
$("btn-next").addEventListener("click", () => go(1));
$("btn-save").addEventListener("click", () => save(false));
$("btn-skip").addEventListener("click", () => save(true));
$("tab-doc").addEventListener("click", () => { S.tab = "doc"; render(); });
$("tab-qa").addEventListener("click", () => { S.tab = "qa"; render(); });
$("btn-guide").addEventListener("click", () => { renderGuide(); $("guide").showModal(); });
$("guide").addEventListener("click", (e) => { if (e.target === $("guide")) $("guide").close(); });

function renderGuide() {
  const body = $("guide-body"); body.replaceChildren();
  const close = el("button", { className: "guide-btn guide-close", type: "button", textContent: "Close" });
  close.addEventListener("click", () => $("guide").close());
  body.append(close,
    el("div", { className: "rule", textContent: "Label each document with three answers: Category (what type of knowledge), Sensitivity (who can read it) and Egress (where a model can process it)." }),
    el("div", { className: "rule", textContent: "Sensitivity and egress are different. A normal document can be local only. A restricted document is always local only." }),
    el("div", { className: "rule", textContent: "Blind items show no suggestion before you save. This measures the effect of suggestions. After you save, the page shows the suggestion." }));
  for (const spec of Object.values(S.tax.questions)) {
    const dl = el("dl");
    for (const [v, o] of Object.entries(spec.options)) {
      dl.append(el("dt", { textContent: `${/^K\d$/.test(v) ? v + " · " : ""}${o.name}` }),
        el("dd", {}, el("span", { textContent: o.desc }), el("span", { textContent: o.use || "" }),
          el("span", { textContent: o.not || "" }), el("span", { textContent: o.example ? `Example: ${o.example}` : "" })));
    }
    body.append(el("h2", { textContent: `${spec.label}: ${spec.instructions}` }), dl);
  }
  const rel = S.tax.relevance; const dl = el("dl");
  for (const [v, name] of Object.entries(rel.options)) dl.append(el("dt", { textContent: name }), el("dd", { textContent: (rel.help || {})[v] || "" }));
  body.append(el("h2", { textContent: `Question–passage: ${rel.label}` }), dl);
}

(async () => {
  try {
    const [items, labels] = await Promise.all([api("/api/items"), api("/api/state")]);
    Object.assign(S, { tax: items.taxonomy, docs: items.docs, qa: items.qa, labels });
    S.idx.doc = firstOpen(S.docs); S.idx.qa = firstOpen(S.qa);
    render();
  } catch (e) {
    $("main").replaceChildren(el("p", { className: "empty", textContent: `Load failed: ${e.message}. Open the access link again.` }));
  }
})();
</script>
</body>
</html>
