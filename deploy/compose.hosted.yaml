# Hosted decision model (Jev, TypeSafe AI). Only LLMDAP gets an outbound network, and every hosted call still
# needs an `llm:egress` grant (deny by default; policy.csv grants only hosted/jev/shadow-labelling).
# Operator decision 2026-10-15: Jev sees only documents labelled normal + cloud_ok, after the label.
#
#   Put JEV_API_KEY into deploy/llmdap/bridge.env (a local, ignored file; never in chat), then:
#   docker compose -f compose.yaml -f deploy/compose.hosted.yaml --profile app --profile decision-models up -d llmdap
services:
  llmdap:
    environment:
      BRIDGE_ROUTES_FILE: /etc/llmdap/routes.hosted.json
    networks: [gateway, models, outbound]

networks:
  outbound: {}
