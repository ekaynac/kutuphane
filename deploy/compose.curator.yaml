# Curator web on the phone (docs/25 §3.1, §3.2; D72). Two services, in their own networks:
#   curator    : `kutuphane curator web` as the database role kutuphane_curator_web (deploy/db-roles-curator.sql);
#                reaches only Postgres (network curator-db) and the sidecar (network curator). No published port.
#   tailscale  : a tailnet node of its own, `kutuphane-curator`, that serves HTTPS 443 → curator:8090 (serve.json).
#                Funnel is never configured: the page is never on the public internet.
# Core is not on either network, so Core cannot reach curator web, and curator web cannot reach Core.
#
# Before the first start (see docs/guide/install.md, "Curator web"):
#   - the tailnet has MagicDNS and HTTPS certificates on; the ACL lets only the operator's devices reach
#     tag:kutuphane-curator:443;
#   - KUTUPHANE_CURATOR_WEB_DB_PASSWORD (the role password) and deploy/tailscale/authkey (mode 600, a tagged,
#     non-reusable auth key) exist;
#   - KUTUPHANE_WEBAUTHN_RP_ID = kutuphane-curator.<tailnet>.ts.net, KUTUPHANE_WEBAUTHN_ORIGIN = https://<that>.
#
#   docker compose -f compose.yaml -f deploy/compose.curator.yaml --profile curator up -d --build
services:
  postgres:
    networks: [db, dev, curator-db]

  curator:
    profiles: [curator]
    build: .
    command: ["kutuphane", "curator", "web", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      KUTUPHANE_CURATOR_WEB_DSN: postgresql://kutuphane_curator_web:${KUTUPHANE_CURATOR_WEB_DB_PASSWORD:?set KUTUPHANE_CURATOR_WEB_DB_PASSWORD}@postgres:5432/kutuphane
      KUTUPHANE_WEBAUTHN_RP_ID: ${KUTUPHANE_WEBAUTHN_RP_ID:?set KUTUPHANE_WEBAUTHN_RP_ID}
      KUTUPHANE_WEBAUTHN_ORIGIN: ${KUTUPHANE_WEBAUTHN_ORIGIN:?set KUTUPHANE_WEBAUTHN_ORIGIN}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    networks: [curator-db, curator]
    depends_on:
      postgres: {condition: service_healthy}

  tailscale:
    profiles: [curator]
    image: tailscale/tailscale:v1.104.2   # pinned; read the release notes before an upgrade
    hostname: kutuphane-curator
    environment:
      TS_AUTHKEY: file:/run/secrets/ts-authkey
      TS_HOSTNAME: kutuphane-curator
      TS_EXTRA_ARGS: --advertise-tags=tag:kutuphane-curator
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale/serve.json:/config/serve.json:ro
      - ./deploy/tailscale/authkey:/run/secrets/ts-authkey:ro
    networks: [curator, tailnet]
    depends_on: [curator]

volumes:
  tailscale-state:

networks:
  curator-db: {internal: true}
  curator: {internal: true}
  tailnet: {}
