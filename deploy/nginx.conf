# The only bridge between users (edge) and Kütüphane Core (internal core network). TLS terminates here in a real
# installation (mount certificates and switch `listen` to 8443 ssl); M1 dev runs plain HTTP on localhost.
server {
    listen 8080;
    # Core refuses an oversized body itself, with its own error. The proxy limit must never be the lower one:
    # - 8m for every route: above the 4 MiB limit of the MCP transport (Core answers 413 `Request body too large`).
    # - 300m for the package upload: above the base64 size of `packages.MAX_PACKAGE_BYTES` (200 MiB source + 1 MiB,
    #   as base64 text 4/3 of that, about 268 MiB) plus the JSON envelope. tests/test_ingress_conf.py fails when
    #   MAX_PACKAGE_BYTES grows past it. The body is streamed (no copy on the ingress disk) so Core's own limit
    #   stops an oversized upload early.
    client_max_body_size 8m;

    location = /v1/packages {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_pass http://core:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://core:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # MCP streamable HTTP
        proxy_read_timeout 300s;
    }
}
