# The only bridge between users (edge) and Kütüphane Core (internal core network). TLS terminates here in a real
# installation (mount certificates and switch `listen` to 8443 ssl); M1 dev runs plain HTTP on localhost.
server {
    listen 8080;
    client_max_body_size 1m;

    location / {
        proxy_pass http://core:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # MCP streamable HTTP
        proxy_read_timeout 300s;
    }
}
