# spark-chat: the only way from the internal `models` network to the host's vLLM (RadixArk/Qwen3.8-27B-NVFP4 on
# host port 8000, OpenAI API). It forwards ONLY POST /v1/chat/completions, and forces Qwen3's non-thinking mode
# (no_thinking.js): Kütüphane reads choices[0].message.content and gains nothing from reasoning tokens but latency.
load_module modules/ngx_http_js_module.so;

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    js_import chat from /etc/nginx/spark-chat/no_thinking.js;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # The body must stay in memory for the rewrite (r.requestText): LLMDAP's default maxRequestBytes.
    client_max_body_size 8m;
    client_body_buffer_size 8m;
    subrequest_output_buffer_size 2m;  # above LLMDAP's 1 MiB chat response cap

    server {
        listen 8000;

        location = /v1/chat/completions {
            limit_except POST { deny all; }
            js_content chat.forward;
        }

        location /vllm/ {
            internal;
            proxy_pass http://vllm-host:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host vllm-host;
            proxy_set_header Authorization "";
            proxy_set_header Content-Type application/json;
            proxy_pass_request_body on;
            proxy_read_timeout 600s;
            proxy_buffering on;
        }

        location / {
            return 404;
        }
    }
}
