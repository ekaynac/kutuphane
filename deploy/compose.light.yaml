# Light install (#76): Postgres, Kütüphane Core and the ingress proxy. No LLMDAP and no model server: only open
# source images and the Core image of this repository.
#   db  (internal): postgres, core
#   web (internal): ingress, core
#   edge          : the ingress proxy, the only way in
# Core has no network to any model. Search is full text only; answers (`ask_library`, `POST /v1/ask`) give 503.
# The local embedder of deploy/compose.local-models.yaml is not part of this file: Core calls a model only through
# LLMDAP (D3), which grants the call and keeps the signed audit chain (AT-09). A direct call would bypass both.
#
# Run from the repository root (docs/guide/install.md, "Light install"):
#   docker compose -f deploy/compose.light.yaml --env-file .env up -d --wait postgres
#   docker compose -f deploy/compose.light.yaml --env-file .env up -d --build --wait
name: kutuphane-light

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: kutuphane
      POSTGRES_USER: kutuphane
      POSTGRES_PASSWORD: ${KUTUPHANE_DB_PASSWORD:?set KUTUPHANE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${KUTUPHANE_DB_PORT:-55432}:5432"   # for the CLI on the host: migrate, ingest, grants
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [db, dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutuphane -d kutuphane"]
      interval: 2s
      retries: 30

  core:
    build: ..
    environment:
      # The app role (deploy/db-roles.sql). No KUTUPHANE_LLMDAP_* and no KUTUPHANE_ANSWER_MODEL: no model calls.
      KUTUPHANE_DSN: postgresql://kutuphane_app:${KUTUPHANE_APP_DB_PASSWORD:?set KUTUPHANE_APP_DB_PASSWORD}@postgres:5432/kutuphane
      KUTUPHANE_PUBLIC_URL: ${KUTUPHANE_PUBLIC_URL:?set KUTUPHANE_PUBLIC_URL}
      KUTUPHANE_OIDC_ISSUER: ${KUTUPHANE_OIDC_ISSUER:?set KUTUPHANE_OIDC_ISSUER}
      KUTUPHANE_OIDC_AUDIENCE: ${KUTUPHANE_OIDC_AUDIENCE:-kutuphane}
      KUTUPHANE_OIDC_JWKS: /run/kutuphane/jwks.json
      KUTUPHANE_REPO_ROOTS: /srv/repos
    volumes:
      - ${KUTUPHANE_OIDC_JWKS_FILE:-./jwks.json}:/run/kutuphane/jwks.json:ro
      - ${KUTUPHANE_REPO_DIR:-./repos}:/srv/repos:ro
    networks: [db, web]
    depends_on:
      postgres: {condition: service_healthy}

  ingress:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${KUTUPHANE_BIND:-127.0.0.1}:${KUTUPHANE_PORT:-8080}:8080"
    networks: [edge, web]
    depends_on: [core]

volumes:
  pgdata:

networks:
  db: {internal: true}
  web: {internal: true}
  edge: {}
  dev: {}
