[project]
name = "kutuphane"
version = "0.1.0"
description = "Kütüphane Core: versioned, explainable knowledge access for people and agents"
requires-python = ">=3.11"
license = { text = "Proprietary — Mega Bilgisayar Tic. Ltd. Şti." }
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
    "pypdf>=5.0,<7",
    "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
kutuphane = "kutuphane.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kutuphane = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
